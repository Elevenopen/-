# 测试环境配置
# 使用 H2 内存数据库，禁用 Redis

spring:
  # H2 内存数据库
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:

  # H2 控制台（可选，调试时启用）
  h2:
    console:
      enabled: false

  # JPA 配置（H2 环境）
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false

  # 禁用 Redis 自动配置（测试环境无 Redis）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Redis 配置（测试环境用 Mock）
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  timeout: 100

# JWT 配置
jwt:
  secret: TestSecretKeyForJWTTokenSigningMustBeLongEnough123456!
  access-token-ttl: 900000
  refresh-token-ttl: 604800000
  token-prefix: "Bearer "
  header-name: "Authorization"

# 日志配置
logging:
  level:
    root: WARN
    com.flowcontrol: DEBUG
    org.springframework.security: DEBUG
